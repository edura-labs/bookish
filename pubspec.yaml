name: bookish
description: "Bookish: Reading Tracker. Track what you read."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.0.3 <4.0.0"

dependencies:
  cached_network_image: ^4.0.6
  cupertino_icons: ^1.0.8
  dio: ^5.11.1
  flutter:
    sdk: flutter
  google_fonts: ^8.0.0
  hive_ce: ^2.22.0
  hive_ce_flutter: ^2.5.0
  intl: ^0.20.3
  liquid_glass_widgets: ^1.20.0
  shimmer: ^4.0.0
  stacked: ^3.4.0
  stacked_services: ^1.1.0

dev_dependencies:
  build_runner: ^2.4.5
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  mockito: ^5.4.1
  stacked_generator: ^1.3.3
  hive_ce_generator: ^1.10.0
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/png/
    # Add assets/svg/ here once it contains a file: git doesn't track empty
    # folders, so a fresh clone would fail to build.
